<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominion.io</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #0a0a0a;
      color: #cccccc;
      overflow: hidden;
    }

    #gameContainer {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: row;
    }

    #canvas {
      flex: 1;
      display: block;
      background-color: #0a0a0a;
      cursor: grab;
    }

    #canvas:active {
      cursor: grabbing;
    }

    #ui {
      width: 300px;
      background-color: #1a1a1a;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #sidebar {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }

    .section {
      margin-bottom: 20px;
    }

    .section h3 {
      margin-bottom: 8px;
      color: #ffff00;
      font-size: 14px;
      text-transform: uppercase;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .stat-label {
      color: #aaaaaa;
    }

    .stat-value {
      color: #ffffff;
    }

    #tooltip {
      position: absolute;
      background-color: rgba(0, 0, 0, 0.9);
      border: 1px solid #444;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      display: none;
      z-index: 100;
      max-width: 200px;
    }

    button {
      background-color: #2a5a2a;
      color: #ffffff;
      border: 1px solid #3a7a3a;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 8px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #3a7a3a;
    }

    button:active {
      background-color: #2a5a2a;
    }

    #debugInfo {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: rgba(0, 0, 0, 0.8);
      border: 1px solid #444;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      color: #0f0;
      display: none;
      z-index: 101;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="sidebar">
        <div class="section">
          <h3>Game</h3>
          <div class="stat">
            <span class="stat-label">Day</span>
            <span class="stat-value" id="statDay">1</span>
          </div>
          <div class="stat">
            <span class="stat-label">Gold</span>
            <span class="stat-value" id="statGold">200</span>
          </div>
        </div>
        <div class="section">
          <h3>Selected Province</h3>
          <div id="provinceInfo" style="font-size: 12px; color: #aaa;">
            Click a province to view details
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="tooltip"></div>
  <div id="debugInfo">
    <div>Zoom: <span id="debugZoom">0.5</span>x</div>
    <div>Pan: <span id="debugPan">2000, 1250</span></div>
    <div>FPS: <span id="debugFps">0</span></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
