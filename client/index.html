<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dominion.io MVP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, sans-serif; 
      background: #0a0e14; 
      color: #e0e0e0;
      overflow: hidden;
    }
    #gameCanvas { 
      display: block; 
      width: 100vw; 
      height: 100vh;
      cursor: crosshair;
    }
    #ui {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(15, 20, 30, 0.9);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334;
      font-size: 14px;
      min-width: 220px;
      z-index: 10;
    }
    #ui h3 { margin-bottom: 8px; color: #7ec8e3; }
    #ui .row { display: flex; justify-content: space-between; margin: 4px 0; }
    #panel {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: rgba(15, 20, 30, 0.95);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334;
      display: none;
      z-index: 10;
    }
    #panel.visible { display: block; }
    #panel h4 { margin-bottom: 8px; color: #7ec8e3; }
    #panel .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #panel button {
      background: #2a4a6a;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    #panel button:hover { background: #3a6a8a; }
    #panel button:disabled { opacity: 0.5; cursor: not-allowed; }
    #chat {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 280px;
      max-height: 300px;
      background: rgba(15, 20, 30, 0.9);
      border-radius: 8px;
      border: 1px solid #334;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }
    #chatLog {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      font-size: 13px;
      min-height: 150px;
    }
    #chatLog .msg { margin: 3px 0; }
    #chatLog .msg .name { color: #7ec8e3; font-weight: 500; }
    #chatInput {
      display: flex;
      border-top: 1px solid #334;
    }
    #chatInput input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 8px;
      color: #e0e0e0;
      outline: none;
    }
    #zoomIndicator {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: rgba(15,20,30,0.9);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      border: 1px solid #334;
    }
    .tooltip {
      position: fixed;
      background: rgba(10,15,25,0.98);
      border: 1px solid #445;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      display: none;
      z-index: 20;
      max-width: 200px;
    }
    .tooltip.visible { display: block; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <div id="ui">
    <h3>🏰 Dominion.io</h3>
    <div class="row"><span>Day:</span><strong id="dayDisplay">1</strong></div>
    <div class="row"><span>Gold:</span><strong id="goldDisplay">100</strong></div>
    <div class="row"><span>Provinces:</span><strong id="provCount">0</strong></div>
    <div style="margin-top:8px;font-size:12px;color:#889">
      <div>• Click province to select</div>
      <div>• Click adjacent to march</div>
      <div>• [R] recruit, [Space] center</div>
    </div>
  </div>
  
  <div id="panel">
    <h4 id="panelTitle">Province</h4>
    <div id="panelContent"></div>
    <div class="controls" id="panelControls"></div>
  </div>
  
  <div id="chat">
    <div id="chatLog"></div>
    <div id="chatInput">
      <input type="text" id="chatText" placeholder="Chat..." maxlength="200"/>
    </div>
  </div>
  
  <div id="zoomIndicator">Zoom: 1.0x</div>
  <div class="tooltip" id="tooltip"></div>
  
  <script type="module" src="main.js"></script>
</body>
</html>
